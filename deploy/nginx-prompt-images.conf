# Snippet: long-cache for /prompt/ images (include inside location ^~ /prompt/ { ... })
# Also used by sites-available/prompt-inspo as a reference.
location ~* ^/prompt/images/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options nosniff always;
}
